# ARCH frontend (Vue SPA) — nginx location snippet.
#
# THIS IS NOT A `server { }` BLOCK. It is included *into* the existing ARCH-OS
# backend vhost so that the SPA and the API share one origin:
#
#     server {
#         server_name arch-os-server.tailf7bd4c.ts.net;
#         root /var/www/arch-os/public;      # Laravel, unchanged
#         …
#         include /etc/nginx/snippets/arch-frontend.conf;   # <- add this line
#         …
#     }
#
# Why one origin (see docs/deploy/FRONTEND_DEPLOY.md §2): Tailscale Funnel
# publishes exactly one hostname for this machine and holds a certificate for
# only that name, so a second `server_name` cannot be reached from outside the
# tailnet. Sharing the origin also means the SPA calls the API at a relative
# `/api` — no CORS configuration, no preflight round-trips, no second
# certificate.
#
# Served layout (maintained by deploy/scripts/publish-release.sh):
#
#     /var/www/arch-frontend/current -> releases/<id>
#     /var/www/arch-frontend/current/app/index.html
#     /var/www/arch-frontend/current/app/assets/index-<hash>.js
#
# `root` is used rather than `alias` on purpose: a release contains a real
# `app/` directory, so /app/x maps to <root>/app/x by plain concatenation and
# none of the well-known `alias` + `try_files` corner cases can apply.
#
# `^~` on every prefix below is load-bearing: it stops nginx from evaluating
# regex locations, so a `location ~ \.php$` or `location ~* \.(js|css)$` in the
# backend vhost cannot capture the SPA's requests.
#
# NOTE ON add_header: nginx does not merge `add_header` across levels — a
# single `add_header` inside a location REPLACES the whole inherited set. Every
# block below therefore restates the security headers rather than relying on the
# surrounding server block, which would otherwise stop applying to exactly the
# pages a human clicks.
#
# ACTION REQUIRED ON DEPLOYMENT DAY (docs/deploy/FRONTEND_DEPLOY.md §8, row 6):
#     sudo nginx -T | grep -n add_header
# and copy any header the backend vhost sets that is not already repeated here
# into ALL THREE blocks. The two most likely candidates are deliberately left
# out because guessing them wrong breaks the app or the origin:
#   * Content-Security-Policy — a policy written for Blade pages will block the
#     SPA's own bundle; copy the vhost's value only after checking it allows
#     'self' scripts, styles and the /api origin.
#   * Strict-Transport-Security — Tailscale Funnel terminates TLS in front of
#     nginx, so this snippet speaks plain HTTP and the header is ignored on the
#     loopback anyway. If the vhost sets it, repeat it verbatim; do not invent
#     a max-age here, because HSTS is hard to walk back.
#
# The post-deploy verification asserts that the headers named below really do
# come back on /app/, so a nested `add_header` added later cannot silently wipe
# them again.

# Bare mount point: without this, /app falls through to Laravel and 404s.
location = /app {
    return 301 /app/;
}

# ── Hashed build output ──────────────────────────────────────────────────────
# Vite renames these on every build, so they can be cached forever. Longest
# matching prefix wins, so this beats the /app/ block below.
location ^~ /app/assets/ {
    root /var/www/arch-frontend/current;
    try_files $uri =404;

    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript text/javascript text/css image/svg+xml application/json;
}

# ── The entry document ───────────────────────────────────────────────────────
# NEVER cache this. index.html is the only file that names the current asset
# hashes; a cached copy pins a browser to a release that has been pruned off
# disk, and the user gets a blank page with 404s in the console until they
# hard-reload. Deliberately no `expires` directive here — `expires` writes its
# own Cache-Control and we would end up sending two of them.
location = /app/index.html {
    root /var/www/arch-frontend/current;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/html;
}

# ── Everything else under the mount point ────────────────────────────────────
# A real file if one exists (favicon, images copied from public/), otherwise
# the SPA entry document — that is the history fallback that lets
# /app/students/12 survive a refresh or a pasted link. The fallback is a URI,
# so it re-enters location matching and picks up the no-store headers above.
location ^~ /app/ {
    root /var/www/arch-frontend/current;
    # `index` is NOT safe to inherit. GET /app/ maps to a real directory, so
    # try_files matches its FIRST parameter as a directory and processing
    # continues into the index module — which reads the `index` directive of the
    # SURROUNDING server block. That block is Laravel's, and Laravel's canonical
    # nginx config sets `index index.php;`. The index module would then look for
    # /app/index.php, not find it, find no other candidate (autoindex is off),
    # and nginx would answer `403 directory index of "…/app/" is forbidden` —
    # while /app/students/1, which reaches the last try_files parameter, worked
    # fine. Setting `index` here is the only way a location snippet can control
    # that; the standalone variant does it at server level instead.
    # The index module's internal redirect to /app/index.html re-enters location
    # matching, so the entry document still picks up the no-store headers above.
    index index.html;
    # No `$uri/` parameter: for any path under the mount that is not a real
    # FILE, the answer an SPA wants is the entry document — never a directory
    # listing, and never an index.html nested somewhere inside the release.
    try_files $uri /app/index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/html text/css application/javascript text/javascript image/svg+xml application/json;
}

# Do NOT enable open_file_cache for this vhost. It caches the resolved path
# behind `current`, which would keep serving a pruned release after a deploy.
